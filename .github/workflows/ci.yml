name: Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    defaults: 
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@v10
      
      - name: Sync uv
        run: uv sync
      
      - name: Check Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Run Test
        run: uv run coverage run -m unittest

      - name: Report
        run: uv run coverage report -m
